<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WS 下单桥接</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/styles.css" />
</head>
<body class="bg-gray-50 text-gray-900 antialiased">

<div class="min-h-screen flex flex-col">

<!-- Header -->
<header class="border-b border-gray-200 bg-white sticky top-0 z-10">
  <div class="max-w-5xl mx-auto px-4 h-12 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <h1 class="text-sm font-bold tracking-tight">🔌 WS 下单桥接</h1>
      <span class="text-[10px] text-gray-400 bg-gray-100 px-1.5 py-0.5 rounded">v2</span>
    </div>
    <div class="flex items-center gap-2">
      <div id="ws-server-status" class="status-badge status-off text-[11px]">
        接入 <span class="ml-0.5 font-semibold">0</span>
      </div>
      <div id="ws-status" class="status-badge status-off text-[11px]" style="display:none">
        WS <span class="ml-0.5 font-semibold">-</span>
      </div>
    </div>
  </div>
</header>

<!-- Main -->
<main class="flex-1 max-w-5xl mx-auto w-full px-4 py-4 space-y-4">

  <!-- Toolbar -->
  <div class="flex items-center justify-between gap-2 flex-wrap">
    <div class="flex items-center gap-2">
      <span class="text-xs font-medium text-gray-500">分发</span>
      <select id="dispatchMode" class="input text-xs" style="width:auto;padding:0.3rem 0.5rem">
        <option value="round-robin">顺序轮询</option>
        <option value="random">随机选一</option>
        <option value="all">全部执行</option>
      </select>
      <span class="text-[10px] text-gray-400 hidden sm:inline">round-robin: 每30分钟恢复1槽位，上限5</span>
    </div>
    <div class="flex items-center gap-1.5">
      <button id="btn-import-json" class="btn btn-ghost text-[11px]">导入</button>
      <button id="btn-add-task" class="btn btn-ghost text-[11px]">+ 账号</button>
      <button id="btn-save-config" class="btn btn-primary text-[11px]">保存</button>
    </div>
  </div>

  <!-- WS Server (collapsible) -->
  <details class="card" open>
    <summary class="section-title cursor-pointer select-none">WS 服务端</summary>
    <div class="grid gap-2 sm:grid-cols-3 mt-2">
      <div>
        <label class="label">路径</label>
        <input id="wsServerPath" class="input" placeholder="/ws" />
      </div>
      <div>
        <label class="label">密钥 <span class="tag tag-muted">可选</span></label>
        <input id="wsServerKey" class="input" placeholder="?key=" />
      </div>
      <div class="flex items-end gap-3">
        <label class="switch-label mb-1">
          <span class="text-[11px] text-gray-500">启用</span>
          <span class="switch"><input id="wsServerEnabled" type="checkbox" class="switch-input" /><span class="switch-track"></span></span>
        </label>
        <label class="switch-label mb-1">
          <span class="text-[11px] text-gray-500">skip信号</span>
          <span class="switch"><input id="wsServerApplySkip" type="checkbox" class="switch-input" /><span class="switch-track"></span></span>
        </label>
      </div>
    </div>
    <div class="mt-2 flex items-center gap-2">
      <code id="wsServerEndpoint" class="flex-1 bg-gray-100 px-2 py-1 rounded text-[11px] font-mono text-gray-500 break-all"></code>
      <button class="btn btn-ghost text-[10px]" onclick="copyWSEndpoint()">复制</button>
    </div>
  </details>

  <!-- Account list -->
  <section>
    <div id="tasks-container" class="space-y-3"></div>
  </section>

  <!-- Logs -->
  <section class="card">
    <div class="flex items-center justify-between mb-1.5">
      <h2 class="section-title">日志</h2>
      <span class="text-[10px] text-gray-400">最近500条</span>
    </div>
    <div id="log-container" class="log-box"></div>
  </section>

</main>
</div>

<script src="/app.js"></script>
</body>
</html>
